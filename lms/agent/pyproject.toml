[project]
name = "praxel-forge-agent"
version = "0.1.0"
description = "Praxel LMS voice interview agent (LiveKit worker). Skeleton — pipeline implemented in U13."
requires-python = ">=3.11"
dependencies = [
    # STT: Deepgram, LLM: Gemini (google plugin), TTS: ElevenLabs
    "livekit-agents[deepgram,google,elevenlabs]>=1.0,<2",
    # Calls back into the LMS internal endpoints (AGENT_INTERNAL_TOKEN + APP_URL)
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
