[project]
name = "praxel-forge-agent"
version = "0.1.0"
description = "Praxel LMS voice interview agent (LiveKit worker)."
requires-python = ">=3.11"
dependencies = [
    # STT/TTS: Sarvam (primary), Deepgram + ElevenLabs (fallback pair),
    # LLM: LiveKit Inference (bundled with LiveKit Cloud - no plugin, no key),
    # VAD: Silero (turn detection for the voice loop)
    "livekit-agents[deepgram,elevenlabs,google,sarvam,silero]>=1.0,<2",
    # Calls back into the LMS internal endpoints (AGENT_INTERNAL_TOKEN + APP_URL)
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
